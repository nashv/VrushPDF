<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VrushPDF</title>
    <script>
      /*
       * Tag the platform before the first paint, so the per-platform tokens in
       * app.css apply to the first frame instead of flashing macOS metrics and
       * then correcting. `lib/platform.ts` reads this back.
       */
      (function () {
        var ua = navigator.userAgent;
        var root = document.documentElement;
        root.dataset.platform =
          ua.indexOf("Mac") !== -1 ? "mac" : ua.indexOf("Win") !== -1 ? "win" : "linux";
        /*
         * Inside the real macOS window the webview is transparent over system
         * Liquid Glass (src-tauri/src/glass.rs), and the stylesheet switches to
         * translucent chrome. wry's `ipc` message handler is what tells that
         * window apart from `vite dev` or the stubbed browser in verify-ui,
         * neither of which has anything behind the page.
         */
        var handlers = window.webkit && window.webkit.messageHandlers;
        if (root.dataset.platform === "mac" && handlers && handlers.ipc) {
          root.dataset.glass = "";
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
