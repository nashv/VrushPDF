[package]
name = "vrushpdf"
version = "0.4.0"
description = "A desktop PDF viewer and annotation editor"
authors = ["nashv"]
license-file = "../LICENSE"
publish = false
repository = "https://github.com/nashv/VrushPDF"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vrushpdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cbc = "0.1"
md-5 = "0.10"
sha2 = "0.10"
# Licensing (`license.rs`, `license_key.rs`): checking the keygen's
# signatures offline. `keygen/` uses the same two.
base64 = "0.22"
ed25519-dalek = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Windows and Linux start a new process per double-clicked file; this hands
# the path to the running one instead. macOS does it natively.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

# The Liquid Glass window backdrop (`glass.rs`). Only the AppKit classes that
# file touches; the crate's default features pull in the whole framework.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSControl",
    "NSGlassEffectView",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
