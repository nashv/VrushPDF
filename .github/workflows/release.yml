# Builds the installers for every platform and, on a version tag, publishes
# them as a GitHub Release in the public VrushPDF repository.
#
# Tauri cannot cross-compile, so each installer has to be produced on its own
# operating system — that is the whole reason this runs in CI rather than on a
# developer's machine.
#
# Note this repository is private, so Actions minutes are billed: macOS runners
# at 10x and Windows at 2x. Use the manual `workflow_dispatch` trigger while
# iterating on the pipeline and keep tags for real releases.
# The release job publishes to nashv/VrushPDF with secrets.PUBLIC_REPO_TOKEN, a
# fine-grained token with Contents: write on that repository only. The job's own
# GITHUB_TOKEN cannot write to another repository.
name: release

on:
  # Cut a release: bump the version in package.json, then tag and push.
  push:
    tags:
      - "v*"
  # Build without publishing anything; the installers come back as workflow
  # artifacts. `platforms` narrows the matrix while iterating — this repo is
  # private, so a full run costs real money at 10x for macOS and 2x for Windows.
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        default: all
        options:
          - all
          - no-macos
          - macos
          - windows
          - linux

jobs:
  # Decide which platforms to build. This has to be its own job: the `matrix`
  # context does not exist in a job's own `if`, so the matrix has to arrive
  # already filtered.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          WANT: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}
        run: |
          # Both macOS targets build on the Apple Silicon runner: Xcode there
          # cross-compiles to x86_64 quite happily, and the toolchain step
          # installs both Rust targets. `macos-13` was retired by GitHub — a job
          # asking for it simply queues forever.
          all='[
            {"platform":"macos-latest","args":"--target aarch64-apple-darwin","label":"macos-arm64"},
            {"platform":"macos-latest","args":"--target x86_64-apple-darwin","label":"macos-x64"},
            {"platform":"windows-latest","args":"","label":"windows"},
            {"platform":"ubuntu-22.04","args":"","label":"linux"}
          ]'
          case "$WANT" in
            no-macos) filter='select(.platform | startswith("macos") | not)' ;;
            macos)    filter='select(.platform | startswith("macos"))' ;;
            windows)  filter='select(.platform | startswith("windows"))' ;;
            linux)    filter='select(.platform | startswith("ubuntu"))' ;;
            *)        filter='.' ;;
          esac
          echo "matrix=$(jq -c "[.[] | $filter]" <<<"$all")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan

    permissions:
      # tauri-action needs this to create the release. If it fails with
      # "Resource not accessible by integration", enable read/write under
      # Settings -> Actions -> Workflow permissions.
      contents: write

    strategy:
      # One platform failing shouldn't throw away the others' build time.
      fail-fast: false
      matrix:
        # arm64 Linux would need the `ubuntu-22.04-arm` runner, which GitHub
        # only offers on public repositories; the QEMU alternative takes about
        # an hour a build. Add it to the `plan` job if this repo goes public.
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Install target corresponding to the runner matrix
          targets: ${{ matrix.label == 'macos-arm64' && 'aarch64-apple-darwin' || (matrix.label == 'macos-x64' && 'x86_64-apple-darwin' || '') }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # Unique cache key per matrix label to prevent ARM64 and x64 cache collisions
          key: ${{ matrix.label }}

      # `npm ci` also runs the prepare script, which copies pdf.js's CMap tables
      # and standard fonts into static/ so the app works offline.
      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and verify roundtrip
        run: |
          npm run check
          npm run verify:roundtrip

      # The license key and trial checks. Needs no built frontend: without the
      # custom-protocol feature Tauri points at devUrl instead of embedding it.
      - name: Rust unit tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo test --manifest-path keygen/Cargo.toml

      # Builds only. Deliberately no release inputs: with four jobs in
      # parallel each would try to create the release, and tauri-action cannot
      # find a *draft* by its tag, so several drafts appear and the assets
      # scatter between them. The `release` job below publishes instead.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: tauri
        with:
          args: ${{ matrix.args }}

      # Gather the bundles into one directory first. The action reports them as
      # a JSON array of absolute paths, which upload-artifact's newline-separated
      # `path` input cannot consume directly. `shell: bash` covers the Windows
      # runner too, and node does the copying so the same code runs everywhere.
      - name: Collect installers
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          mkdir -p dist-artifacts
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            for (const from of JSON.parse(process.env.ARTIFACT_PATHS)) {
              // The .app is a directory the DMG already contains; copied here,
              // the release job's find -type f would spill its insides
              // (Info.plist, the bare binary) into the release as loose files.
              if (from.endsWith('.app')) continue;
              const to = path.join('dist-artifacts', path.basename(from));
              fs.cpSync(from, to, { recursive: true });
              console.log(path.basename(from));
            }
          "

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.label }}
          path: dist-artifacts/
          if-no-files-found: error

  # One job, after every build, so exactly one release exists and it has all of
  # the installers.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # Publish the way it was done by hand: everything goes into a *draft*
      # first, and only once every installer is there at its full size does the
      # release go public. A single `gh release create` with the files made the
      # release public before its uploads finished, so a dropped connection
      # left a public release without some of its installers (1.0.1).
      #
      # A failure here fails the job. It used to fall back to a private draft
      # and stay green, so for months a green run meant nothing had been
      # published. The fallback draft is still made, so the installers can be
      # published from it by hand.
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -uo pipefail
          ls -R dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          FILES=$(find dist -maxdepth 1 -type f | sort)
          TAG="${GITHUB_REF_NAME}"
          TARGET_REPO="nashv/VrushPDF"
          NOTES='Download the installer for your platform below. These builds are unsigned — see the README for how to get past Gatekeeper and SmartScreen.'
          export GH_TOKEN="${PUBLIC_REPO_TOKEN:-${RELEASE_TOKEN:-$GITHUB_TOKEN}}"

          # Upload each file with retries; a release asset upload is one long
          # request, and one dropped connection should not lose the release.
          upload_all() {
            local repo="$1" f i
            for f in $FILES; do
              for i in 1 2 3 4 5; do
                gh release upload "$TAG" "$f" --repo "$repo" --clobber && continue 2
                echo "Upload of $(basename "$f") failed (attempt $i), retrying..."
                sleep 15
              done
              echo "::error::Could not upload $(basename "$f") to $repo"
              return 1
            done
          }

          publish_public() {
            local was_public=0
            if gh release view "$TAG" --repo "$TARGET_REPO" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
              # A re-run of a tag that is already out: refresh its files only.
              was_public=1
            elif ! gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
              gh release create "$TAG" --repo "$TARGET_REPO" --draft \
                --title "VrushPDF $TAG" --notes "$NOTES" || return 1
            fi

            upload_all "$TARGET_REPO" || return 1

            # Every installer must be there at the size it was built at, and
            # nothing else: leftovers from an earlier attempt would be offered
            # for download too.
            local expected actual
            expected=$(for f in $FILES; do echo "$(basename "$f") $(stat -c %s "$f")"; done | sort)
            actual=$(gh release view "$TAG" --repo "$TARGET_REPO" --json assets \
              --jq '.assets[] | "\(.name) \(.size)"' | sort) || return 1
            if [ "$expected" != "$actual" ]; then
              echo "::error::The assets in $TARGET_REPO do not match the build"
              diff <(echo "$expected") <(echo "$actual")
              return 1
            fi
            echo "All $(echo "$expected" | wc -l) assets verified in $TARGET_REPO"

            if [ "$was_public" -eq 0 ]; then
              gh release edit "$TAG" --repo "$TARGET_REPO" --draft=false --latest || return 1
            fi
            echo "Published: https://github.com/$TARGET_REPO/releases/tag/$TAG"
          }

          if publish_public; then
            exit 0
          fi

          echo "::error title=Public release not published::Could not publish $TAG to $TARGET_REPO; see the errors above (a 403 means PUBLIC_REPO_TOKEN is missing, expired or lacks Contents: write). The installers are in a draft release in ${GITHUB_REPOSITORY} to publish by hand."
          export GH_TOKEN="$GITHUB_TOKEN"
          if ! gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --draft \
              --title "VrushPDF $TAG" --notes "$NOTES"
          fi
          upload_all "${GITHUB_REPOSITORY}"
          exit 1
