[package]
name = "vrushpdf-keygen"
version = "0.1.0"
description = "Issues VrushPDF license keys, offline"
edition = "2021"
publish = false

# Its own crate, not a second bin in src-tauri: Tauri bundles every bin of the
# app's package, and this must not ship inside the app.

[[bin]]
name = "keygen"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
